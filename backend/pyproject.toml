# 도구 설정 전용 (ruff, pytest). 패키지 빌드 설정은 두지 않는다.
# 검사 명령은 모두 backend/ 에서 실행한다:
#   ruff check .
#   ruff format --check .
#   pytest

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 오류
    "W",   # pycodestyle 경고
    "F",   # pyflakes
    "I",   # import 정렬
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (보안)
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# 테스트에서는 assert 사용을 허용한다.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
