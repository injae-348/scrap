# /etc/logrotate.d/scrap-app 로 설치한다 (deploy/README.md 3-3단계).
# /opt/scrap-app/logs 의 로그(duckdns.log, 이후 deploy.log·backup.log)를 주 단위로 돌려 디스크를 보호한다.
/opt/scrap-app/logs/*.log {
	weekly
	rotate 8
	maxsize 5M
	compress
	delaycompress
	missingok
	notifempty
	# logs/ 디렉터리 소유자가 deploy 이므로 deploy 권한으로 회전한다.
	su deploy deploy
	create 0640 deploy deploy
}
