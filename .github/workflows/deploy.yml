# main 병합 시 배포. ⚠️ 이 파일을 바꾸는 PR은 설명 맨 위에 "⚠️ 배포 경로 변경"을 표시한다 (CLAUDE.md).
#
#   test   : ci.yml 재사용 (frontend, backend 검사 재실행)
#   build  : buildx 로 서버 아키텍처(linux/amd64) api·web 이미지 → GHCR push, 태그 = 커밋 SHA
#            web 은 push 전에 이미지 안 /srv 를 꺼내 비밀값 형태를 검사하고(deploy/scan-dist.sh), push 한 이미지가
#            검사한 이미지와 같은 층인지 확인한다. 빌드 인자는 공개값인 커밋 SHA(VITE_APP_BUILD_ID)뿐이다.
#   deploy : [수동 승인] Environment "production" → ssh deploy@서버 "<SHA>"
#            서버 쪽은 authorized_keys 강제 명령으로 deploy/deploy.sh 만 실행된다 (백업 → pull → up → 헬스체크 → 실패 시 롤백).
#
# 공개 저장소 주의
#   - pull_request_target 을 쓰지 않는다. 시크릿은 production Environment 에만 있고 deploy 잡만 그 Environment 를 쓴다.
#   - Actions 로그는 누구나 볼 수 있다. 서버 주소·도메인은 시크릿(DEPLOY_HOST)으로만 다뤄 로그에서 *** 로 가려지게 하고,
#     SSH 출력의 IPv4 주소는 한 번 더 가린다.
#   - workflow_dispatch(수동 실행)는 두지 않는다: 임의 브랜치를 골라 배포 단계까지 가는 경로를 만들지 않기 위해.
#     같은 커밋을 다시 배포하려면 Actions 에서 해당 실행의 "Re-run jobs" 를 쓴다 (승인은 다시 필요).
name: Deploy

on:
  push:
    branches: [main]

# 기본은 아무 권한도 없음. 잡마다 필요한 것만 준다.
permissions: {}

concurrency:
  # 배포는 한 번에 하나. 진행 중인 배포(승인 대기 포함)는 취소하지 않고, 뒤에 온 실행은 기다린다.
  # (대기 중인 실행이 여럿이면 GitHub이 가장 최근 것만 남긴다 → 최신 main 이 배포된다)
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # docker-compose.yml 의 이미지 이름(ghcr.io/injae-348/scrap-api|scrap-web)과 같아야 한다.
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/scrap-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/scrap-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source 라벨: GHCR이 패키지를 이 저장소에 자동으로 연결한다.
      # provenance: false — 단일 매니페스트로 올려 GHCR 화면에 unknown/unknown 항목이 생기지 않게 한다.
      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=scrap-api
          cache-from: type=gha,scope=scrap-api
          cache-to: type=gha,scope=scrap-api,mode=max

      # web: 먼저 러너 docker 에 불러와(load, push 없음) 이미지 안 /srv 를 검사한다 → 통과해야 push 한다.
      # 빌드 인자 VITE_APP_BUILD_ID = 커밋 SHA (공개값. 프론트가 index.html·서비스워커에 넣어 PWA 갱신 안내에 쓴다).
      # ⚠️ 빌드 인자에 비밀값을 넣지 않는다 (공개 이미지·로그로 보일 수 있다, deploy/README.md 17-2).
      - name: Build web (load for scan, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_APP_BUILD_ID=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=scrap-web
          cache-from: type=gha,scope=scrap-web

      - name: Scan web image /srv for secrets (before push)
        run: bash deploy/scan-dist.sh --image "${WEB_IMAGE}:${GITHUB_SHA}"

      # 같은 입력으로 다시 빌드하면 바로 앞 단계의 빌더 캐시를 그대로 써서 같은 층이 나온다 → 그대로 push.
      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_APP_BUILD_ID=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=scrap-web
          cache-from: type=gha,scope=scrap-web
          cache-to: type=gha,scope=scrap-web,mode=max

      # push 한 이미지의 층(압축 전 digest)이 검사한 이미지와 같은지 확인한다. 다르면 배포 단계로 넘어가지 않는다.
      # 단일 매니페스트(provenance: false)가 아니면 .rootfs 가 없어 여기서 실패한다 (GHCR 정리 워크플로의 전제도 함께 확인).
      - name: Verify pushed web image = scanned image
        run: |
          set -euo pipefail
          ref="${WEB_IMAGE}:${GITHUB_SHA}"
          scanned=$(docker image inspect --format '{{json .RootFS.Layers}}' "$ref" | jq -c .)
          pushed=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -c '.rootfs.diff_ids')
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::push 한 web 이미지가 검사한 이미지와 다릅니다 (배포하지 않음)"
            exit 1
          fi
          echo "push 한 web 이미지 = 검사한 이미지 ($(echo "$pushed" | jq length)개 층)"

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 필수 승인자(본인) 승인 후에만 시작된다. 시크릿 4개는 이 Environment 에만 있다 (deploy/README.md 12-2).
    environment: production
    # 체크아웃도 패키지 권한도 필요 없다.
    permissions: {}
    steps:
      - name: Prepare SSH key and known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::production Environment 시크릿 ${name} 이(가) 비어 있음 (deploy/README.md 12-2)"
              exit 1
            fi
          done
          dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/deploy-ssh"
          # 원격 명령 문자열은 SHA 하나뿐. 서버는 강제 명령으로 이 값을 SSH_ORIGINAL_COMMAND 로 받아 형식을 검사한다.
          # 출력의 IP 주소(IPv4·IPv6)는 가린다 (SSH 오류 메시지에 서버 공인 IP가 찍힐 수 있음).
          # IPv6 패턴은 콜론 그룹 5개 이상 또는 '::' 포함만 잡는다 (로그의 시:분:초 타임스탬프는 그대로 둔다).
          ssh -T -n \
            -i "$dir/key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -o LogLevel=ERROR \
            -- "${DEPLOY_USER}@${DEPLOY_HOST}" "$DEPLOY_SHA" 2>&1 \
            | sed -E \
                -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
                -e 's/([0-9a-fA-F]{1,4}:){4,7}[0-9a-fA-F]{1,4}/x:x::x/g' \
                -e 's/[0-9a-fA-F]*(:[0-9a-fA-F]+)*::([0-9a-fA-F]+:?)*/x:x::x/g'

      - name: External health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          # 서버 안의 헬스체크(deploy.sh)는 로컬 Caddy를 거친다. 여기서는 인터넷 쪽(DNS·방화벽·인증서)까지 한 번 더 본다.
          # DEPLOY_HOST 는 사이트 도메인(<이름>.duckdns.org)이어야 한다. 실패해도 롤백하지 않는다 (서버 안 확인은 통과했으므로).
          for i in 1 2 3 4 5 6; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 --proto '=https' \
              "https://${DEPLOY_HOST}/api/health" 2>/dev/null)"
            if [ "$code" = "200" ]; then
              echo "외부 헬스체크 통과 (${i}번째 시도)"
              exit 0
            fi
            echo "외부 헬스체크 대기 (${i}번째: HTTP ${code})"
            sleep 5
          done
          echo "::error::외부에서 /api/health 가 200이 아님. 서버 안 헬스체크는 통과했으므로 DNS(DuckDNS)·OCI 보안 목록·iptables 를 확인 (deploy/README.md 10절)"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
