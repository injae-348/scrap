# PR 검사 전용 워크플로. 배포 단계는 없다 (배포는 deploy.yml에서만).
# 공개 저장소이므로 pull_request_target은 쓰지 않고, 시크릿도 사용하지 않는다.
# 경로 필터(paths)는 일부러 쓰지 않는다: 필수 검사로 지정했을 때 검사가 안 돌아 PR이 막히는 것을 막기 위함.
#
# main 병합 후의 "테스트 재실행"은 deploy.yml 이 이 파일을 workflow_call 로 다시 부른다
# (검사 단계를 한 곳에서만 관리). 그래서 main push 트리거는 두지 않는다 (같은 검사가 두 번 도는 것 방지).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # 같은 PR의 이전 실행은 취소한다.
  # deploy.yml 에서 불릴 때는 실행마다 다른 그룹(run_id)이 되어, 부른 쪽 배포 그룹과 엉키지 않는다.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    # 필수 검사 이름으로 쓰이므로 바꾸지 않는다.
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    # 필수 검사 이름으로 쓰이므로 바꾸지 않는다.
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          # 설치는 requirements-dev.txt 하나만 한다 (런타임 의존성 포함) → 캐시 키도 이 파일 기준.
          cache-dependency-path: backend/requirements-dev.txt

      # 해시 모드: 하위 의존성까지 모든 줄에 해시가 있어야 하고, 목록에 없거나 해시가 다른 패키지는 설치되지 않는다.
      # requirements.txt 를 같이 넘기지 않는다 (requirements-dev.txt 가 런타임 의존성을 모두 포함).
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest

      # 고정된 의존성의 알려진 취약점 검사 (PyPI 취약점 정보 조회, 설치는 하지 않음).
      # requirements.txt = api 이미지에 들어가는 것, requirements-dev.txt = CI·개발 도구까지.
      # --strict: 검사하지 못한 패키지가 있어도 실패로 본다.
      - name: Dependency audit (pip-audit)
        run: |
          pip-audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements.txt
          pip-audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements-dev.txt

  images:
    # 두 Dockerfile이 빌드되는지만 확인한다 (push 없음, 시크릿 없음). main 에서는 deploy.yml 이 직접 빌드하므로 PR에서만.
    name: images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 캐시는 main 빌드(deploy.yml)가 만든 것을 읽기만 한다 (PR이 캐시를 쓰지 않음).
      - name: Build api image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=scrap-api

      - name: Build web image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=scrap-web
